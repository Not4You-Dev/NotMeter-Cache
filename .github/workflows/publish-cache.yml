name: Publish verified cache
on:
  push:
    branches: [main]
    paths: ['.cache/deploy.json', 'site/**', 'build-pages.mjs', '.github/workflows/publish-cache.yml']
  workflow_dispatch:
concurrency:
  group: cache-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Verify and assemble current and previous cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
